<!DOCTYPE html>
<html>
<head>
    <title>Beginner HTML Task</title>
</head>
<body>

    <header>
        <h1>Welcome to My Page</h1>
        <p>This is my beginner HTML practice.</p>
    </header>

    <nav>
        <a href="#form">Go to Form</a> | 
        <a href="#table">Go to Table</a>
    </nav>

    <section id="form">
        <h2>User Information Form</h2>
        <!-- Form that collects basic user information[cite: 1] -->
        <form>
            <label>Name:</label> 
            <input type="text" name="name"><br><br>

            <label>Email:</label> 
            <input type="email" name="email"><br><br>

            <label>Gender:</label>
            <!-- Radio buttons for gender[cite: 1] -->
            <input type="radio" name="gender" value="male"> Male 
            <input type="radio" name="gender" value="female"> Female<br><br>

            <label>Favorite Hobbies:</label>
            <!-- Checkboxes for hobbies[cite: 1] -->
            <input type="checkbox" name="hobby" value="reading"> Reading 
            <input type="checkbox" name="hobby" value="sports"> Sports 
            <input type="checkbox" name="hobby" value="music"> Music<br><br>

            <!-- Submit button[cite: 1] -->
            <button type="submit">Submit</button>
        </form>
    </section>

    <article id="table">
        <h2>Personal Details</h2>
        <!-- Table with at least 3 rows and columns for personal info[cite: 1] -->
        <table border="1">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Occupation</th>
            </tr>
            <tr>
                <td>Ali</td>
                <td>22</td>
                <td>Student</td>
            </tr>
            <tr>
                <td>Kim</td>
                <td>28</td>
                <td>Artist</td>
            </tr>
            <tr>
                <td>Sam</td>
                <td>35</td>
                <td>Teacher</td>
            </tr>
        </table>
    </article>

    <footer>
        <p>Created by a beginner student.</p>
    </footer>

</body>
</html>
